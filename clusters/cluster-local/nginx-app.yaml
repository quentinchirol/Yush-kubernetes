apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-local
  namespace: argocd
spec:
  project: default
  source:
    # ⚠️ À remplacer par l'URL de ton propre dépôt GitHub une fois créé
    repoURL: 'https://github.com/TonUtilisateur/mon-infra-kubernetes.git'
    targetRevision: HEAD
    # Chemin vers les templates de l'application dans le repo
    path: apps/nginx
  destination:
    # Cluster de destination (ici, le cluster local où ArgoCD est installé)
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    # Synchronisation automatique (GitOps magique !)
    automated:
      prune: true     # Supprime les ressources si elles sont retirées de GitHub
      selfHeal: true  # Corrige automatiquement si quelqu'un modifie le cluster à la main
