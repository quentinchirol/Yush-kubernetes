{{- range $name, $config := .Values.components }}
{{- if $config.public }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - {{ $name }}.{{ $.Values.global.domain }}
      secretName: {{ $name }}-tls
  rules:
    - host: {{ $name }}.{{ $.Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: 80
{{- end }}
{{- end }}
