# @AI_SPACE
# @purpose  : Création automatique du secret Docker registry pour GHCR
# @logic    : Job one-shot idempotent (dry-run + apply).
#             Le ServiceAccount + RBAC ci-dessous lui donnent les droits nécessaires.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-secret-creator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-creator
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-secret-creator-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: ghcr-secret-creator
  namespace: default
roleRef:
  kind: Role
  name: secret-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-ghcr-secret
  namespace: default
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ghcr-secret-creator
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "[INIT] K3S est prêt ! Création du secret registry..."
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=quentinchirol \
            --docker-password=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 \
            --dry-run=client -o yaml | kubectl apply -n default -f -
