apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: example-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: example-app
        image: ghcr.io/quentinchirol/example-app:fe4b1ff3869adb2443adf0c601492c2ba22b41f5
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: example-app-secrets
              key: database-url
        - name: PORT
          value: "3000"
