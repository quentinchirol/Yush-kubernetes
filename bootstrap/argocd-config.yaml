# @AI_SPACE
# @purpose  : Configuration Argo CD (Namespace, LoadBalancer, Mot de passe, Connexion SSH GitHub)
# @logic    : Définit les éléments requis avant ou après l'installation standard d'Argo CD.
#             Le secret redéfinit le mot de passe de l'utilisateur 'admin' en 'admin'.
#             La connexion au repo GitHub se fait via SSH.

apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
  name: argocd-server
  namespace: argocd
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
