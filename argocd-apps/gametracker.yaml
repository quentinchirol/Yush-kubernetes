apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gametracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/quentinchirol/Yush-kubernetes.git
    targetRevision: HEAD
    path: apps/gametracker
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true